name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publish a static tree to the gh-pages branch.
# Prefer this over actions/deploy-pages, which has been timing out
# ("Timeout reached, aborting!") on this repo.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'node_modules/' \
            --exclude 'functions/' \
            --exclude 'firebase-debug.log' \
            --exclude 'firebase-debug.*.log' \
            --exclude '*.bak' \
            ./ _site/
          # Keep custom domain for tbs-zermatt.org
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          cname: tbs-zermatt.org
          commit_message: Deploy ${{ github.sha }}
