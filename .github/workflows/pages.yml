name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Official GitHub Pages deploy (Actions). Requires:
# Settings → Pages → Source = GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'node_modules/' \
            --exclude 'functions/' \
            --exclude 'scripts/' \
            --exclude 'data/' \
            --exclude '.firebase/' \
            --exclude 'firebase-debug.log' \
            --exclude 'firebase-debug.*.log' \
            --exclude 'firebase.json' \
            --exclude '.firebaserc' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'storage.rules' \
            --exclude 'firestore.rules.example' \
            --exclude 'blog-website.code-workspace' \
            --exclude '*.bak' \
            --exclude '*.md' \
            ./ _site/
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
